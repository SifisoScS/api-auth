name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Smoke — token round-trip
        env:
          # Throwaway value: the module requires JWT_SECRET and has no default (by design).
          JWT_SECRET: ci-smoke-only-not-a-real-secret
        run: |
          node -e "
            const m = require('./dist/index.js');
            const token = m.generateToken({ id: 'ci' });
            const verified = m.verifyToken(token);
            if (!verified) process.exit(1);
            console.log('auth smoke: ok');
          "
